[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darts"
version = "0.1.0"
description = "Solver for the optimal dart aim given a player's accuracy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Remi Fabre" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/darts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
